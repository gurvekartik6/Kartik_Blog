<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Kartik Yadav Gurve</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .login-box h2 { margin-bottom: 30px; text-align: center; color: #333; }
    .input-group { margin-bottom: 20px; }
    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #764ba2; }
    .dashboard {
      display: none;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .dashboard-header {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .dashboard-header h1 { color: #333; font-size: 1.5rem; margin: 0; }
    .logout-btn { width: auto; padding: 10px 20px; background: #e74c3c; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
    .stat-card h3 { color: #666; font-size: 14px; margin-bottom: 10px; }
    .stat-number { font-size: 32px; font-weight: bold; color: #667eea; }
    .section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .section h2 { margin-bottom: 20px; font-size: 1.3rem; color: #333; }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #f8f9fa; font-weight: 600; }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .bg-warning { background: #f39c12; color: white; }
    .bg-success { background: #27ae60; color: white; }
    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      margin: 0 3px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-approve { background: #27ae60; color: white; }
    .btn-delete { background: #e74c3c; color: white; }
    .btn-read { background: #3498db; color: white; }
    .btn-approve:hover { background: #219a52; }
    .btn-delete:hover { background: #c0392b; }
    .btn-read:hover { background: #2980b9; }
    .loading { text-align: center; padding: 40px; color: white; }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      z-index: 9999;
      animation: slideIn 0.3s ease;
    }
    .notification.success { background: #27ae60; }
    .notification.error { background: #e74c3c; }
    @media (max-width: 768px) {
      th, td { font-size: 12px; padding: 8px; }
      .dashboard-header { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

<div class="login-container" id="loginContainer">
  <div class="login-box">
    <h2><i class="fa-solid fa-lock"></i> Admin Login</h2>
    <div id="loginError" style="color:#e74c3c;margin-bottom:15px;text-align:center;"></div>
    <form id="loginForm">
      <div class="input-group">
        <input type="text" id="username" placeholder="Username" required>
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Password" required>
      </div>
      <button type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> Login</button>
    </form>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="dashboard-header">
    <h1><i class="fa-solid fa-chart-line"></i> Admin Dashboard</h1>
    <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Logout</button>
  </div>
  
  <div class="stats-grid" id="statsGrid"></div>
  
  <div class="section">
    <h2><i class="fa-regular fa-comment"></i> Pending Comments</h2>
    <div id="pendingComments" class="table-container"></div>
  </div>
  
  <div class="section">
    <h2><i class="fa-regular fa-envelope"></i> Contact Messages</h2>
    <div id="contactsList" class="table-container"></div>
  </div>
</div>

<script>
async function checkAuth() {
  try {
    const res = await fetch('/api/admin/check-auth');
    const data = await res.json();
    if (data.authenticated) {
      document.getElementById('loginContainer').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadData();
    } else {
      document.getElementById('loginContainer').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
    }
  } catch (error) {
    console.error('Auth check failed:', error);
  }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorDiv = document.getElementById('loginError');
  
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok) {
      errorDiv.textContent = '';
      checkAuth();
    } else {
      errorDiv.textContent = data.error || 'Invalid credentials';
    }
  } catch (error) {
    errorDiv.textContent = 'Network error. Please try again.';
  }
});

async function logout() {
  await fetch('/api/admin/logout', { method: 'POST' });
  checkAuth();
}

function showNotification(message, type = 'success') {
  const notification = document.createElement('div');
  notification.className = `notification ${type}`;
  notification.innerHTML = message;
  document.body.appendChild(notification);
  setTimeout(() => notification.remove(), 3000);
}

async function loadData() {
  try {
    // Load stats
    const statsRes = await fetch('/api/admin/stats');
    const stats = await statsRes.json();
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card">
        <h3>Pending Comments</h3>
        <div class="stat-number">${stats.pendingComments}</div>
      </div>
      <div class="stat-card">
        <h3>Total Comments</h3>
        <div class="stat-number">${stats.totalComments}</div>
      </div>
      <div class="stat-card">
        <h3>Unread Messages</h3>
        <div class="stat-number">${stats.unreadContacts}</div>
      </div>
      <div class="stat-card">
        <h3>Total Messages</h3>
        <div class="stat-number">${stats.totalContacts}</div>
      </div>
    `;
    
    // Load pending comments
    const commentsRes = await fetch('/api/admin/comments');
    const comments = await commentsRes.json();
    const pending = comments.filter(c => !c.approved);
    
    if (pending.length === 0) {
      document.getElementById('pendingComments').innerHTML = '<p style="text-align:center;padding:20px;">No pending comments ✨</p>';
    } else {
      document.getElementById('pendingComments').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Post</th>
              <th>Name</th>
              <th>Email</th>
              <th>Comment</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${pending.map(c => `
              <tr id="comment-${c.id}">
                <td style="white-space:nowrap;">${new Date(c.created_at).toLocaleString()}</td>
                <td><code>${escapeHtml(c.post_slug)}</code></td>
                <td><strong>${escapeHtml(c.name)}</strong></td>
                <td>${escapeHtml(c.email)}</td>
                <td style="max-width:300px;">${escapeHtml(c.body.substring(0, 150))}${c.body.length > 150 ? '...' : ''}</td>
                <td>
                  <button class="btn-sm btn-approve" onclick="approveComment(${c.id})">
                    <i class="fa-regular fa-check-circle"></i> Approve
                  </button>
                  <button class="btn-sm btn-delete" onclick="deleteComment(${c.id})">
                    <i class="fa-regular fa-trash-can"></i> Delete
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }
    
    // Load contacts
    const contactsRes = await fetch('/api/contacts');
    const contacts = await contactsRes.json();
    
    if (contacts.length === 0) {
      document.getElementById('contactsList').innerHTML = '<p style="text-align:center;padding:20px;">No messages yet 📭</p>';
    } else {
      document.getElementById('contactsList').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Name</th>
              <th>Email</th>
              <th>Subject</th>
              <th>Message</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${contacts.map(c => `
              <tr id="contact-${c.id}" style="${c.read ? 'opacity:0.7;' : ''}">
                <td style="white-space:nowrap;">${new Date(c.created_at).toLocaleString()}</td>
                <td><strong>${escapeHtml(c.name)}</strong></td>
                <td>${escapeHtml(c.email)}</td>
                <td>${escapeHtml(c.subject || '-')}</td>
                <td style="max-width:300px;">${escapeHtml(c.message.substring(0, 150))}${c.message.length > 150 ? '...' : ''}</td>
                <td>
                  <span class="badge ${c.read ? 'bg-success' : 'bg-warning'}">
                    ${c.read ? '✓ Read' : '○ Unread'}
                  </span>
                </td>
                <td>
                  ${!c.read ? `<button class="btn-sm btn-read" onclick="markAsRead(${c.id})">
                    <i class="fa-regular fa-envelope-open"></i> Mark Read
                  </button>` : ''}
                  <button class="btn-sm btn-delete" onclick="deleteContact(${c.id})">
                    <i class="fa-regular fa-trash-can"></i> Delete
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }
  } catch (error) {
    console.error('Failed to load data:', error);
    showNotification('Failed to load data', 'error');
  }
}

async function approveComment(id) {
  try {
    const res = await fetch(`/api/admin/comments/${id}/approve`, { method: 'PATCH' });
    if (res.ok) {
      showNotification('Comment approved!', 'success');
      document.getElementById(`comment-${id}`)?.remove();
    } else {
      throw new Error('Failed to approve');
    }
  } catch (error) {
    showNotification('Failed to approve comment', 'error');
  }
}

async function deleteComment(id) {
  if (!confirm('Delete this comment?')) return;
  try {
    const res = await fetch(`/api/admin/comments/${id}`, { method: 'DELETE' });
    if (res.ok) {
      showNotification('Comment deleted', 'success');
      document.getElementById(`comment-${id}`)?.remove();
    } else {
      throw new Error('Failed to delete');
    }
  } catch (error) {
    showNotification('Failed to delete comment', 'error');
  }
}

async function markAsRead(id) {
  try {
    const res = await fetch(`/api/contacts/${id}/read`, { method: 'PATCH' });
    if (res.ok) {
      showNotification('Message marked as read', 'success');
      const row = document.getElementById(`contact-${id}`);
      if (row) {
        row.style.opacity = '0.7';
        const statusSpan = row.querySelector('.badge');
        statusSpan.className = 'badge bg-success';
        statusSpan.innerHTML = '✓ Read';
        const actionCell = row.querySelector('td:last-child');
        const markButton = actionCell.querySelector('.btn-read');
        if (markButton) markButton.remove();
      }
    } else {
      throw new Error('Failed to mark as read');
    }
  } catch (error) {
    showNotification('Failed to mark as read', 'error');
  }
}

async function deleteContact(id) {
  if (!confirm('Delete this message?')) return;
  try {
    const res = await fetch(`/api/contacts/${id}`, { method: 'DELETE' });
    if (res.ok) {
      showNotification('Message deleted', 'success');
      document.getElementById(`contact-${id}`)?.remove();
    } else {
      throw new Error('Failed to delete');
    }
  } catch (error) {
    showNotification('Failed to delete message', 'error');
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

checkAuth();
setInterval(() => {
  if (document.getElementById('dashboard').style.display === 'block') {
    loadData();
  }
}, 30000);
</script>
</body>
</html>
